<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário</title>

    <link rel="stylesheet" href="../../parte_CSS/perfil.css">

    <script src="auth.js" defer></script>
    <script src="perfil.js" defer></script>
</head>

<body>

<a href="../index.html" class="voltar-home">Home</a>

<main class="perfil-page">

    <section class="perfil-header">
        <div class="foto-perfil">👤</div>
    </section>

    <section class="perfil-box">
        
        <h2>Informações do Perfil</h2>

        <label>Nome</label>
        <input type="text" id="nome" readonly>

        <label>Email</label>
        <input type="email" id="email" readonly>

    </section>

    <section class="perfil-box">
        <h2>Meus Interesses</h2>

        <div id="interessesLista" class="interesses-lista">
            <p>Carregando interesses...</p>
        </div>
    </section>

    <section class="salvar-box">
        <button onclick="logout()">Sair</button>
    </section>

</main>

</body>
</html>
